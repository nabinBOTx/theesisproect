{% extends "base.html" %}

{% block content %}
<div class="recommendations-page">
    <h1>📊 Your Learning Dashboard</h1>
    
    <div class="dashboard-grid">
        <div id="difficulty-indicator-container"></div>
        
        <div id="user-stats-container" class="stats-section">
            <div class="loading">Loading your performance stats...</div>
        </div>
        
        <div id="recommendations-container" class="recommendations-section">
            <div class="loading">Loading personalized recommendations...</div>
        </div>
    </div>

    <div class="dashboard-actions">
        <h2>Ready to improve?</h2>
        <div class="action-buttons">
            <a href="{{ url_for('games') }}" class="btn btn-primary">Play Games</a>
            <a href="{{ url_for('learn') }}" class="btn btn-secondary">Browse Learning Modules</a>
            <a href="{{ url_for('index') }}" class="btn btn-tertiary">Back to Home</a>
        </div>
    </div>
</div>

<style>
    .recommendations-page {
        max-width: 1000px;
        margin: 0 auto;
    }

    .recommendations-page h1 {
        text-align: center;
        color: var(--cyan);
        margin-bottom: 30px;
        font-size: 28px;
    }

    .dashboard-grid {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .stats-section,
    .recommendations-section {
        min-height: 100px;
    }

    .loading {
        text-align: center;
        color: var(--muted);
        padding: 20px;
        font-style: italic;
    }

    .dashboard-actions {
        margin-top: 40px;
        padding: 30px;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        border-radius: 12px;
        border: 1px solid rgba(102, 126, 234, 0.3);
        text-align: center;
    }

    .dashboard-actions h2 {
        color: var(--cyan);
        margin-top: 0;
    }

    .action-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-top: 20px;
    }

    .btn {
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        display: inline-block;
    }

    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
        background: rgba(102, 126, 234, 0.2);
        color: var(--cyan);
        border: 1px solid rgba(102, 126, 234, 0.5);
    }

    .btn-secondary:hover {
        background: rgba(102, 126, 234, 0.3);
    }

    .btn-tertiary {
        background: transparent;
        color: var(--muted);
        border: 1px solid rgba(102, 126, 234, 0.3);
    }

    .btn-tertiary:hover {
        color: var(--cyan);
        border-color: rgba(102, 126, 234, 0.6);
    }

    @media (max-width: 768px) {
        .recommendations-page h1 {
            font-size: 22px;
        }

        .dashboard-actions {
            padding: 20px;
        }

        .action-buttons {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}
