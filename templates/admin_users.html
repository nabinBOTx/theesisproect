<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(26, 26, 46, 0.9);
            border-bottom: 1px solid rgba(76, 175, 80, 0.3);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .navbar h1 {
            font-size: 24px;
            color: #4caf50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .navbar-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .btn-secondary:hover {
            background: rgba(76, 175, 80, 0.3);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff5252 0%, #ff1744 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 23, 68, 0.4);
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .search-section {
            margin-bottom: 30px;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-input:focus {
            outline: none;
            border-color: #4caf50;
            background: rgba(255, 255, 255, 0.15);
        }

        .users-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(26, 26, 46, 0.8);
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .users-table thead {
            background: rgba(76, 175, 80, 0.2);
            border-bottom: 1px solid rgba(76, 175, 80, 0.3);
        }

        .users-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #4caf50;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .users-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(76, 175, 80, 0.1);
        }

        .users-table tbody tr:hover {
            background: rgba(76, 175, 80, 0.1);
        }

        .rank-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .rank-platinum {
            background: linear-gradient(135deg, #e8d5ff 0%, #d5a6ff 100%);
            color: #6a0dad;
        }

        .rank-gold {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #8b6914;
        }

        .rank-silver {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
            color: #404040;
        }

        .rank-bronze {
            background: linear-gradient(135deg, #cd7f32 0%, #e8a76a 100%);
            color: #5d3a1a;
        }

        .xp-value {
            color: #4caf50;
            font-weight: 600;
        }

        .badges-cell {
            font-size: 12px;
            max-width: 250px;
        }

        .badge-item {
            display: inline-block;
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            padding: 3px 8px;
            border-radius: 12px;
            margin: 2px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .privilege-select {
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .privilege-select:hover {
            border-color: #4caf50;
        }

        .privilege-select:focus {
            outline: none;
            border-color: #4caf50;
            background: rgba(255, 255, 255, 0.15);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-update {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
            border: 1px solid #4caf50;
        }

        .btn-update:hover {
            background: rgba(76, 175, 80, 0.3);
        }

        .btn-delete {
            background: rgba(255, 23, 68, 0.2);
            color: #ff1744;
            border: 1px solid #ff1744;
        }

        .btn-delete:hover {
            background: rgba(255, 23, 68, 0.3);
        }

        .stats-header {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-mini {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-mini-value {
            font-size: 28px;
            font-weight: 700;
            color: #4caf50;
        }

        .stat-mini-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #4caf50;
            font-size: 18px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            margin: 10% auto;
            padding: 30px;
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #4caf50;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4caf50;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
        }

        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4caf50;
            background: rgba(255, 255, 255, 0.15);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
            z-index: 2000;
        }

        .toast.error {
            background: #ff1744;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .users-table {
                font-size: 12px;
            }

            .users-table th,
            .users-table td {
                padding: 10px;
            }

            .search-section {
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>👥 User Management</h1>
        <div class="navbar-actions">
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">← Back to Dashboard</a>
            <a href="{{ url_for('admin_logout') }}" class="btn btn-danger">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="stats-header">
            <div class="stat-mini">
                <div class="stat-mini-value" id="totalUsers">-</div>
                <div class="stat-mini-label">Total Users</div>
            </div>
            <div class="stat-mini">
                <div class="stat-mini-value" id="totalXP">-</div>
                <div class="stat-mini-label">Total XP</div>
            </div>
            <div class="stat-mini">
                <div class="stat-mini-value" id="avgRank">-</div>
                <div class="stat-mini-label">Top Rank</div>
            </div>
            <div class="stat-mini">
                <div class="stat-mini-value" id="totalGames">-</div>
                <div class="stat-mini-label">Games Played</div>
            </div>
        </div>

        <div class="search-section">
            <input type="text" class="search-input" id="searchInput" placeholder="Search by username or email...">
            <select class="search-input" id="rankFilter" style="flex: 0 1 150px;">
                <option value="">All Ranks</option>
                <option value="Platinum">Platinum</option>
                <option value="Gold">Gold</option>
                <option value="Silver">Silver</option>
                <option value="Bronze">Bronze</option>
            </select>
            <select class="search-input" id="privilegeFilter" style="flex: 0 1 150px;">
                <option value="">All Privileges</option>
                <option value="user">User</option>
                <option value="moderator">Moderator</option>
                <option value="banned">Banned</option>
            </select>
        </div>

        <div id="usersTableContainer" class="loading">Loading users...</div>
    </div>

    <!-- Edit Privilege Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit User Privilege</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="form-group">
                <label>User: <span id="editUsername"></span></label>
            </div>
            <div class="form-group">
                <label for="privilegeSelect">New Privilege Level:</label>
                <select id="privilegeSelect">
                    <option value="user">User</option>
                    <option value="moderator">Moderator</option>
                    <option value="banned">Banned</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="btn-confirm" onclick="savePrivilege()">Update Privilege</button>
            </div>
        </div>
    </div>

    <script>
        let allUsers = [];
        let currentEditUserId = null;

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                if (!response.ok) throw new Error('Failed to load users');
                
                allUsers = await response.json();
                renderUsersTable(allUsers);
                updateStats(allUsers);
            } catch (error) {
                console.error('Error loading users:', error);
                document.getElementById('usersTableContainer').innerHTML = 
                    '<div class="empty-state">Failed to load users. Please try again.</div>';
            }
        }

        function updateStats(users) {
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalXP').textContent = users.reduce((sum, u) => sum + u.xp, 0).toLocaleString();
            document.getElementById('totalGames').textContent = users.reduce((sum, u) => sum + u.games_played, 0);
            
            const ranks = users.map(u => u.rank);
            const rankOrder = { 'Platinum': 0, 'Gold': 1, 'Silver': 2, 'Bronze': 3 };
            const topRank = ranks.sort((a, b) => (rankOrder[a] || 999) - (rankOrder[b] || 999))[0];
            document.getElementById('avgRank').textContent = topRank || '-';
        }

        function renderUsersTable(users) {
            if (users.length === 0) {
                document.getElementById('usersTableContainer').innerHTML = 
                    '<div class="empty-state">No users found.</div>';
                return;
            }

            let html = `
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Rank</th>
                            <th>XP</th>
                            <th>Badges</th>
                            <th>Games Played</th>
                            <th>Privilege</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            users.forEach(user => {
                const rankClass = `rank-${user.rank.toLowerCase()}`;
                const badgesHtml = user.badges.map(b => `<span class="badge-item">${b}</span>`).join('');

                html += `
                    <tr>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.email}</td>
                        <td><span class="rank-badge ${rankClass}">${user.rank}</span></td>
                        <td><span class="xp-value">${user.xp.toLocaleString()}</span></td>
                        <td class="badges-cell">${badgesHtml}</td>
                        <td>${user.games_played}</td>
                        <td>
                            <select class="privilege-select" onchange="openEditModal(${user.id}, this.value)">
                                <option value="${user.privilege}" selected>${user.privilege}</option>
                                <option value="user">User</option>
                                <option value="moderator">Moderator</option>
                                <option value="banned">Banned</option>
                            </select>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-small btn-delete" onclick="deleteUser(${user.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById('usersTableContainer').innerHTML = html;
        }

        function filterUsers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const rankFilter = document.getElementById('rankFilter').value;
            const privilegeFilter = document.getElementById('privilegeFilter').value;

            const filtered = allUsers.filter(user => {
                const matchesSearch = !searchTerm || 
                    user.username.toLowerCase().includes(searchTerm) ||
                    user.email.toLowerCase().includes(searchTerm);
                const matchesRank = !rankFilter || user.rank === rankFilter;
                const matchesPrivilege = !privilegeFilter || user.privilege === privilegeFilter;
                
                return matchesSearch && matchesRank && matchesPrivilege;
            });

            renderUsersTable(filtered);
        }

        function openEditModal(userId, currentPrivilege) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            currentEditUserId = userId;
            document.getElementById('editUsername').textContent = user.username;
            document.getElementById('privilegeSelect').value = currentPrivilege || user.privilege;
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditUserId = null;
        }

        async function savePrivilege() {
            if (!currentEditUserId) return;

            const privilege = document.getElementById('privilegeSelect').value;

            try {
                const response = await fetch(`/api/admin/user/${currentEditUserId}/privilege`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ privilege })
                });

                if (!response.ok) throw new Error('Failed to update privilege');

                showToast('Privilege updated successfully', false);
                closeEditModal();
                loadUsers();
            } catch (error) {
                console.error('Error updating privilege:', error);
                showToast('Failed to update privilege', true);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) return;

            try {
                const response = await fetch(`/api/admin/user/${userId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete user');

                showToast('User deleted successfully', false);
                loadUsers();
            } catch (error) {
                console.error('Error deleting user:', error);
                showToast('Failed to delete user', true);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'error' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterUsers);
        document.getElementById('rankFilter').addEventListener('change', filterUsers);
        document.getElementById('privilegeFilter').addEventListener('change', filterUsers);
        window.addEventListener('click', (event) => {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeEditModal();
            }
        });

        // Load users on page load
        loadUsers();
    </script>
</body>
</html>
