{% extends 'base.html' %}
{% block content %}
<section class="card">
    <div class="card-header">
        <div class="progress-wrap">
            <div>Setting {{ number }} of {{ total }}</div>
            <div class="progress">
                <div class="progress-bar" style="width: {{ (number/total*100)|round(0, 'floor') }}%"></div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <p class="prompt" style="font-size: 20px; margin-bottom: 24px;">
            <strong>{{ setting.setting }}</strong>
        </p>
        <p style="text-align: center; color: var(--muted); margin-bottom: 24px;">
            Choose the most secure option:
        </p>
        <form action="{{ url_for('device_defender_answer') }}" method="post" class="choices">
            {% for option in setting.options %}
            <label class="choice choice-hover" style="cursor: pointer;">
                <input class="visually-hidden" type="radio" name="choice" value="{{ loop.index0 }}" required />
                <span class="bullet"></span>
                <span class="choice-text">{{ option }}</span>
            </label>
            {% endfor %}
            <div class="actions">
                <button class="primary" type="submit">Submit</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
