<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CYBER//GUARD</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cyber-theme.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'JetBrains Mono', monospace;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 217, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            pointer-events: none;
            z-index: 0;
        }

        .register-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
        }

        .register-card {
            background: rgba(15, 20, 25, 0.95);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 217, 255, 0.1);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .register-title {
            font-size: 28px;
            color: #00d9ff;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .register-subtitle {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            color: #00d9ff;
            font-size: 11px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.05);
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .password-requirements {
            background: rgba(0, 217, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 6px;
            padding: 10px 12px;
            margin-top: 8px;
            font-size: 11px;
            color: #aaa;
        }

        .requirement {
            margin: 4px 0;
        }

        .requirement.met {
            color: #4caf50;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            border: none;
            border-radius: 6px;
            color: #001a1f;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'JetBrains Mono', monospace;
            margin-top: 15px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid rgba(255, 23, 68, 0.5);
            color: #ff5252;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 12px;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 217, 255, 0.2);
            font-size: 12px;
        }

        .login-link a {
            color: #00d9ff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .login-link a:hover {
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00d9ff;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .back-link:hover {
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    
    <a href="{{ url_for('index') }}" class="back-link">← Back Home</a>

    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <div class="logo">🛡️</div>
                <div class="register-title">CYBER//GUARD</div>
                <div class="register-subtitle">Create Account</div>
            </div>

            {% if error %}
            <div class="error-message">⚠️ {{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}" id="registerForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" placeholder="Choose a username" required autofocus>
                    <div class="password-requirements">
                        <div class="requirement">• At least 3 characters</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-input" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Create a password" id="password" required>
                    <div class="password-requirements">
                        <div class="requirement" id="length">• At least 6 characters</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="Confirm your password" id="confirmPassword" required>
                    <div class="password-requirements">
                        <div class="requirement" id="match">• Passwords must match</div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">> CREATE ACCOUNT</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="{{ url_for('login') }}">Login here</a>
            </div>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const lengthReq = document.getElementById('length');
        const matchReq = document.getElementById('match');

        function validatePassword() {
            // Check length
            if (passwordInput.value.length >= 6) {
                lengthReq.classList.add('met');
            } else {
                lengthReq.classList.remove('met');
            }

            // Check match
            if (passwordInput.value && confirmInput.value && passwordInput.value === confirmInput.value) {
                matchReq.classList.add('met');
            } else {
                matchReq.classList.remove('met');
            }
        }

        passwordInput.addEventListener('input', validatePassword);
        confirmInput.addEventListener('input', validatePassword);
    </script>
</body>
</html>
