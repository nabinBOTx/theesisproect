<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyberware</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cyber-theme.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='adaptive.css') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grid-overlay"></div>
    <div class="main-content">
        <header class="header">
            <div class="logo-section">
                <a href="{{ url_for('index') }}" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
                    <div class="logo-shield"></div>
                    <div class="logo-text">CYBER//GUARD</div>
                </a>
            </div>
            <nav class="header-nav">
                <a href="{{ url_for('learn') }}">Learn</a>
                <a href="{{ url_for('games') }}">Games</a>
                <button type="button" onclick="window.__csqToggleTheme && __csqToggleTheme()" title="Toggle theme" style="background: none; border: none; color: var(--cyan); cursor: pointer; font-size: 18px;">🌓</button>
            </nav>
        </header>
        <main class="container" style="max-width: 1100px; margin: 48px auto; padding: 24px;">
            {% block content %}{% endblock %}
        </main>
        <footer class="footer" style="margin-top: 36px; color: var(--muted); font-size: 13px; text-align: center;">
            <small>Learn. Spot threats. Stay safe.</small>
        </footer>
    </div>
    <style>
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 217, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px;
            pointer-events: none;
            z-index: 0;
        }

        .main-content {
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 48px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-shield {
            width: 28px;
            height: 32px;
            border: 2px solid var(--matrix-green);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            display: inline-block;
            background: transparent;
        }

        .logo-shield::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 8px solid var(--matrix-green);
        }

        .logo-shield::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            background: var(--matrix-green);
            border-radius: 50%;
        }

        .logo-text {
            font-weight: 700;
            color: var(--matrix-green);
            font-size: 24px;
            letter-spacing: 2px;
            font-family: 'JetBrains Mono', monospace;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-nav a {
            color: var(--cyan);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .header-nav a:hover {
            color: #ffffff;
        }

        /* Game page styles */
        .hero {
            padding: 48px;
            border-radius: 8px;
            background: linear-gradient(90deg, rgba(0,0,0,0.25), rgba(255,255,255,0.02));
            box-shadow: 0 6px 30px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        .hero h1 {
            color: var(--matrix-green);
            font-size: 40px;
            margin: 0;
        }

        .hero p {
            color: var(--cyan);
            margin-top: 8px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 36px;
        }

        .feature {
            padding: 24px;
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(255,255,255,0.02));
            border: 1px solid rgba(0,217,255,0.04);
        }

        .feature h3 {
            margin: 0 0 12px 0;
            color: var(--cyan);
        }

        .feature p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(0,255,65,0.06);
            padding: 16px;
            border-radius: 6px;
            color: #cfeff8;
        }

        .card-header {
            padding: 16px;
            border-bottom: 1px solid rgba(0,255,65,0.06);
            margin: -16px -16px 0 -16px;
            color: var(--cyan);
        }

        .card-body {
            padding: 16px;
        }

        .progress-wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            color: var(--cyan);
            font-size: 14px;
        }

        .progress {
            flex: 1;
            height: 10px;
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--matrix-green), var(--cyan));
        }

        .prompt {
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 24px;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .choice {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid rgba(0,255,65,0.2);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice label:hover {
            border-color: var(--matrix-green);
            background: rgba(0,255,65,0.05);
        }

        .choice input {
            margin-right: 8px;
        }

        .choice span {
            color: var(--cyan);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            justify-content: center;
        }

        .primary {
            background: linear-gradient(90deg, var(--matrix-green), #00cc33);
            color: #001219;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 65, 0.3);
        }

        .result {
            padding: 24px;
        }

        .result h2 {
            color: var(--matrix-green);
            font-size: 28px;
            margin-top: 0;
        }

        .review-list {
            list-style: none;
            padding: 0;
            margin: 24px 0;
        }

        .review-item {
            margin-bottom: 24px;
            padding: 16px;
            border-left: 4px solid rgba(0,255,65,0.3);
            background: rgba(0,255,65,0.02);
            border-radius: 4px;
        }

        .review-q {
            color: var(--cyan);
            font-weight: 600;
            margin-bottom: 12px;
        }

        .review-a {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .review-a.correct {
            border-left-color: var(--matrix-green);
            background: rgba(0,255,65,0.05);
        }

        .review-a.incorrect {
            border-left-color: #ef6a6a;
            background: rgba(239, 106, 106, 0.05);
        }

        .explanation {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: var(--muted);
        }

        @media (max-width: 768px) {
            .header {
                padding: 24px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .choice {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='ui.js') }}"></script>
    <script src="{{ url_for('static', filename='particles.js') }}"></script>
    <script src="{{ url_for('static', filename='chatbot.js') }}"></script>
    <script src="{{ url_for('static', filename='adaptive.js') }}"></script>
</body>
</html>
