{% extends 'base.html' %}
{% block content %}
<section class="card">
    <div class="card-header">
        <div class="progress-wrap">
            <div>Password {{ number }} of {{ total }}</div>
            <div class="progress">
                <div class="progress-bar" style="width: {{ (number/total*100)|round(0, 'floor') }}%"></div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 24px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; 
                        background: #12182b; border: 2px solid #232a49; padding: 20px; border-radius: 12px; 
                        letter-spacing: 2px; color: var(--primary);">
                {{ challenge.password }}
            </div>
        </div>
        <p class="prompt" style="text-align: center; font-size: 18px; margin-bottom: 24px;">
            Is this password <strong>strong</strong> or <strong>weak</strong>?
        </p>
        <form action="{{ url_for('password_ninja_guess') }}" method="post" class="choices" style="max-width: 400px; margin: 0 auto;">
            <label class="choice choice-hover" style="cursor: pointer;">
                <input class="visually-hidden" type="radio" name="guess" value="strong" required />
                <span class="bullet"></span>
                <span class="choice-text">✅ Strong Password</span>
            </label>
            <label class="choice choice-hover" style="cursor: pointer;">
                <input class="visually-hidden" type="radio" name="guess" value="weak" required />
                <span class="bullet"></span>
                <span class="choice-text">❌ Weak Password</span>
            </label>
            <div class="actions">
                <button class="primary" type="submit">Submit</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
