<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CYBER//GUARD — Master Cybersecurity</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='cyber-theme.css') }}">
  <style>
    body {
      background: #0f1419;
      background-image: 
        linear-gradient(rgba(0, 255, 65, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 65, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      min-height: 100vh;
      position: relative;
    }
    
    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(0, 217, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 217, 255, 0.05) 1px, transparent 1px);
      background-size: 100px 100px;
      pointer-events: none;
      z-index: 0;
    }

    .main-content {
      position: relative;
      z-index: 1;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 48px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-shield {
      width: 28px;
      height: 32px;
      border: 2px solid var(--matrix-green);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      position: relative;
      display: inline-block;
      background: transparent;
    }

    .logo-shield::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-bottom: 8px solid var(--matrix-green);
    }

    .logo-shield::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      background: var(--matrix-green);
      border-radius: 50%;
    }

    .logo-text {
      font-weight: 700;
      color: var(--matrix-green);
      font-size: 24px;
      letter-spacing: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .header-nav a {
      color: var(--cyan);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .header-nav a:hover {
      color: #ffffff;
    }

    .btn-header {
      background: linear-gradient(90deg, var(--matrix-green), var(--cyan));
      color: #001219;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-header:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 255, 65, 0.3);
    }

    .hero-section {
      max-width: 1200px;
      margin: 80px auto 0;
      padding: 0 48px;
      text-align: center;
    }

    .protocol-box {
      display: inline-block;
      background: rgba(0, 217, 255, 0.08);
      border: 1px solid rgba(0, 217, 255, 0.4);
      padding: 10px 18px;
      border-radius: 4px;
      color: #ffffff;
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
    }

    .hero-title {
      font-size: 80px;
      font-weight: 700;
      line-height: 0.95;
      margin: 0 0 32px 0;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -1px;
    }

    .hero-title .master {
      color: var(--matrix-green);
      display: block;
    }

    .hero-title .cybersecurity {
      color: #ffffff;
      display: block;
    }

    .hero-subtitle {
      color: #ffffff;
      font-size: 19px;
      margin-bottom: 16px;
      opacity: 0.95;
      line-height: 1.5;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-tagline {
      color: var(--cyan);
      font-size: 17px;
      margin-bottom: 48px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 80px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--matrix-green), #00cc33);
      color: #001219;
      padding: 18px 36px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 255, 65, 0.3);
    }

    .btn-secondary {
      background: rgba(0, 0, 0, 0.2);
      color: #ffffff;
      padding: 18px 36px;
      border: 1px solid rgba(0, 217, 255, 0.5);
      border-radius: 6px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      font-family: 'JetBrains Mono', monospace;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-secondary:hover {
      background: rgba(0, 217, 255, 0.15);
      border-color: rgba(0, 217, 255, 0.7);
      transform: translateY(-2px);
    }

    .stats-section {
      display: flex;
      justify-content: center;
      gap: 100px;
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 48px 0;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 52px;
      font-weight: 700;
      color: var(--matrix-green);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 12px;
      line-height: 1;
    }

    .stat-label {
      color: #ffffff;
      font-size: 15px;
      opacity: 0.85;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .footer-attribution {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ffffff;
      color: #001219;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      z-index: 10;
    }

    .footer-attribution .icon {
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .hero-title {
        font-size: 48px;
      }
      
      .stats-section {
        flex-direction: column;
        gap: 40px;
      }

      .header {
        padding: 16px 24px;
      }

      .hero-section {
        padding: 0 24px;
      }
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="main-content">
    <header class="header">
      <div class="logo-section">
        <span class="logo-shield"></span>
        <span class="logo-text">CYBER//GUARD</span>
      </div>
      <nav class="header-nav">
        <a href="{{ url_for('cyber_login') }}">Login</a>
        <a href="{{ url_for('cyber_signup') }}" class="btn-header">Get Started</a>
      </nav>
    </header>

    <section class="hero-section">
      <div class="protocol-box">> INITIALIZING SECURITY PROTOCOL</div>
      <h1 class="hero-title">
        <span class="master">MASTER</span>
        <span class="cybersecurity">CYBERSECURITY</span>
      </h1>
      <p class="hero-subtitle">Level up your digital defense skills through immersive games and challenges.</p>
      <p class="hero-tagline">Learn. Play. Protect.</p>
      
      <div class="hero-buttons">
        <a href="{{ url_for('cyber_signup') }}" class="btn-primary">> Start Training</a>
        <a href="{{ url_for('cyber_login') }}" class="btn-secondary">Access Portal</a>
      </div>

      <div class="stats-section">
        <div class="stat-item">
          <div class="stat-number">2.5K+</div>
          <div class="stat-label">Active Users</div>
        </div>
        <div class="stat-item">
          <div class="stat-number" style="color: #ffffff;">8</div>
          <div class="stat-label">Security Games</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">15K+</div>
          <div class="stat-label">Threats Blocked</div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
